apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: csi-storage-alerts
  namespace: csi-demo
  labels:
    release: observability
spec:
  groups:
    - name: csi-storage
      rules:
        - alert: CsiPvcPending
          expr: kube_persistentvolumeclaim_status_phase{namespace="csi-demo", phase="Pending"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PVC pending in csi-demo"
            description: "A PVC in csi-demo has been Pending for 5 minutes. Check the CSI controller and StorageClass (EFS filesystem ID substitution is the usual lab cause)."
        - alert: CsiPvcNearFull
          expr: kubelet_volume_stats_used_bytes{namespace="csi-demo"} / kubelet_volume_stats_capacity_bytes{namespace="csi-demo"} > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "PVC over 85% full in csi-demo"
            description: "A CSI volume is over 85% full. Expand the PVC (allowVolumeExpansion is set on ebs-gp3 and powerscale classes) or clean up."
        - alert: CsiPodNotReady
          expr: kube_pod_status_ready{namespace="csi-demo", pod=~"postgres.*"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Postgres pod not ready in csi-demo"
            description: "Postgres has not been Ready for 5 minutes. Outside the node-drain drill this means the volume did not reattach; on EBS check AZ placement."
        - alert: CsiControllerDown
          expr: absent(kube_pod_status_phase{pod=~"csi.*|ebs-csi.*|efs-csi.*", phase="Running"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "No CSI controller pod running"
            description: "No CSI controller pod is Running. Provisioning, snapshots, and expansion will stall until the driver is back."
        - alert: CsiSnapshotNotReady
          expr: kube_volumesnapshot_status_ready{namespace="csi-demo"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Volume snapshot not ready in csi-demo"
            description: "A VolumeSnapshot has not reached readyToUse in 10 minutes. Check the snapshot controller and the CSI driver logs."
        # Multi-window burn-rate alerts on the availability SLI
        # (Postgres pod Ready). SLO: 99.9% availability over 30
        # days, about 43 minutes of downtime a month for a single
        # replica. The fast window fires on a hard failure within
        # minutes; the slow window fires on repeated short
        # outages. Both are validated by tests only — no live
        # cluster has fired them yet.
        - alert: PostgresAvailabilityBurnFast
          expr: avg_over_time(kube_pod_status_ready{namespace="csi-demo", pod=~"postgres.*"}[5m]) < 0.95
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Postgres availability burning fast"
            description: "Postgres has been unavailable more than 5% of the last 5 minutes (SLO 99.9%). A hard node failure looks like this until the out-of-service taint or the guard recovers it."
        - alert: PostgresAvailabilityBurnSlow
          expr: avg_over_time(kube_pod_status_ready{namespace="csi-demo", pod=~"postgres.*"}[1h]) < 0.99
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Postgres availability burning slowly"
            description: "Postgres has been unavailable more than 1% of the last hour (SLO 99.9%). Repeated short outages, not one hard failure."
