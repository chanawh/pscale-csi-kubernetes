# CloudNativePG bootstrap secret for k8s/cnpg/cluster.yaml.
# CNPG requires the bootstrap secret to be a
# kubernetes.io/basic-auth secret with username/password
# keys, and the username must match the cluster's owner
# (postgres). The repo's postgres-secret.yaml does NOT
# qualify: its keys are POSTGRES_USER / POSTGRES_PASSWORD
# / POSTGRES_DB, so a cluster pointed at it would never
# create. This secret exists only for the CNPG cluster.
# Lab-only password ("postgres"), same placeholder as
# k8s/postgres-secret.yaml; change before any real use.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-cnpg-secret
  namespace: csi-demo
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  password: postgres
