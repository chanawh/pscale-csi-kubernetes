# Restore: a new PVC, 10 GiB, from the postgres-snap snapshot.
# Apply this after deleting the test data, and the data comes back.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-restored
  namespace: csi-demo
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: powerscale
  resources:
    requests:
      storage: 10Gi
  dataSource:
    name: postgres-snap
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
