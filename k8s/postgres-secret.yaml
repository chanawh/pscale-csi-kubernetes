# Lab-only secret. Password is "postgres", base64-encoded, and
# is meant to be changed before any real use. Never commit a real
# password; this one is a lab placeholder, stated as such.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: csi-demo
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: csi_demo
