# Postgres on PowerScale. One replica, because Postgres itself
# is not clustered here; the point is the storage, not HA Postgres.
# The volumeMount is /var/lib/postgresql/data, which is the NFS
# export on OneFS. Kill the pod and the data survives, because
# the data was never in the pod.
apiVersion: v1
kind: Namespace
metadata:
  name: csi-demo
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: csi-demo
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Eviction tolerations tuned for the node-failure drill:
      # Kubernetes waits tolerationSeconds before evicting pods
      # from a node that goes NotReady/Unreachable. The default is
      # 300s, so an untuned test only measures the default. 30s
      # makes recovery ~10x faster; set it here, not by editing
      # the cluster, so the timing is reproducible.
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          # Ready means accepting connections, not just
          # "container started": the drill scripts wait for
          # pod Ready and then run a psql test job at once.
          # Without this probe the job can hit a pod whose
          # server is still starting and fail on
          # connection-refused — the guard-live drill's
          # trial-1 failure (run 45529757950, drill step
          # 7m55s: setup ~2min, guard taint ~240s after the
          # kill, then the post-taint test job failed).
          # pg_isready is the postgres-native check.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: csi-demo
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
