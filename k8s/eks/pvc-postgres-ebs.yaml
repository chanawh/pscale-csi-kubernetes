# Postgres claim on EBS. 10 GiB, ReadWriteOnce, because EBS
# is block storage: one node attaches it at a time. Same
# size as the PowerScale PVC so the drills compare like for
# like: snapshot, clone (EBS clone is a snapshot restore),
# expand 10 to 20 GiB, node drain.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-ebs
  namespace: csi-demo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ebs-gp3
  resources:
    requests:
      storage: 10Gi
