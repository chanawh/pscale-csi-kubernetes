# EFS StorageClass for EKS. File storage, ReadWriteMany:
# the AWS-native counterpart to PowerScale NFS in the kind
# lab. provisioningMode: efs-ap means the driver creates one
# EFS access point per PVC, so volumes are isolated by POSIX
# user and root directory, not just by path.
#
# fileSystemId is substituted by scripts/eks/deploy_eks.sh
# from `terraform output -raw efs_file_system_id`. The
# placeholder below is not a real filesystem; applying this
# file by hand without substituting it leaves PVCs Pending,
# which is the correct failure: never silently mount the
# wrong filesystem.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: "${EFS_FILE_SYSTEM_ID}"
  directoryPerms: "0777"
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate
